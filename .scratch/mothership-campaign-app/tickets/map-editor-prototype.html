<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jump Cluster editor — prototype</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #e8dfcf;
      --sheet: #f5f0e6;
      --sheet-strong: #fffaf0;
      --ink: #242a26;
      --muted: #70746c;
      --line: #d4cbbb;
      --line-dark: #aaa18f;
      --accent: #9e4c36;
      --moss: #50685c;
      --gold: #c8a867;
      --serif: "Palatino Linotype", "Book Antiqua", Georgia, serif;
      --sans: "Trebuchet MS", "Segoe UI", sans-serif;
      --mono: Consolas, "Courier New", monospace;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 360px;
      padding: 0 22px 108px;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(255,255,255,.24), transparent 44%),
        repeating-linear-gradient(0deg, rgba(69,57,38,.025) 0 1px, transparent 1px 5px),
        var(--paper);
      font: 15px/1.45 var(--serif);
    }

    button, input, textarea, select { font: inherit; }
    button {
      border: 1px solid var(--line-dark);
      border-radius: 4px;
      padding: 8px 11px;
      color: var(--ink);
      background: var(--sheet-strong);
      cursor: pointer;
    }
    button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible,
    [role="button"]:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    button:disabled { opacity: .45; cursor: not-allowed; }
    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line-dark);
      border-radius: 3px;
      padding: 8px 9px;
      color: var(--ink);
      background: #fffdf7;
    }
    input[aria-invalid="true"] { border-color: var(--accent); background: #fff3eb; }
    textarea { min-height: 76px; resize: vertical; }
    label { display: block; color: var(--muted); font: 11px/1.3 var(--sans); letter-spacing: .08em; text-transform: uppercase; }
    label input, label textarea, label select { display: block; margin-top: 6px; text-transform: none; letter-spacing: normal; }
    h1, h2, h3, p { margin-top: 0; }
    h1, h2, h3 { font-weight: 500; }
    .app-shell { width: min(1540px, 100%); margin: 0 auto; }
    .topbar {
      min-height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      border-bottom: 1px solid var(--line-dark);
    }
    .brand { display: flex; align-items: center; gap: 11px; min-width: 205px; }
    .brand-stamp {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid var(--accent);
      border-radius: 50%;
      color: var(--accent);
      font: 11px var(--mono);
    }
    .brand-name { display: block; font-size: 17px; letter-spacing: .025em; }
    .brand-note { display: block; margin-top: 2px; color: var(--muted); font: 9px var(--sans); letter-spacing: .15em; }
    .top-scope { min-width: 130px; text-align: center; }
    .top-scope small { display: block; color: var(--muted); font: 9px var(--sans); letter-spacing: .16em; text-transform: uppercase; }
    .top-scope strong { font-size: 17px; font-weight: 500; }
    .top-actions { display: flex; align-items: center; gap: 7px; }
    .top-actions button { font: 12px var(--sans); }
    .top-actions .primary { border-color: var(--ink); color: var(--sheet-strong); background: var(--ink); }
    .top-actions .primary:hover:not(:disabled) { border-color: var(--accent); background: var(--accent); }
    .intro {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 18px;
      padding: 14px 2px 12px;
    }
    .intro p { margin: 0; color: var(--muted); font-size: 13px; }
    .prototype-tag { color: var(--accent); font: 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }
    .actionbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: rgba(255,250,240,.68);
    }
    .action-group { display: flex; align-items: center; gap: 5px; }
    .actionbar button, .actionbar select { min-height: 34px; padding: 6px 9px; font: 11px var(--sans); }
    .actionbar select { width: 126px; }
    .actionbar .sep { width: 1px; height: 25px; margin: 0 2px; background: var(--line); }
    .actionbar .view-tabs { margin-left: auto; }
    .view-tabs button.active { border-color: var(--moss); color: var(--sheet-strong); background: var(--moss); }
    .workspace-title { display: flex; justify-content: space-between; align-items: end; gap: 16px; }
    .eyebrow { display: block; color: var(--accent); font: 10px var(--mono); letter-spacing: .14em; text-transform: uppercase; }
    .workspace-title h1 { margin: 3px 0 4px; font-size: clamp(22px, 2vw, 30px); }
    .workspace-title p { margin: 0; color: var(--muted); font-size: 12px; }
    .map-stamp { color: var(--muted); font: 10px var(--mono); text-align: right; }
    .map-frame {
      position: relative;
      min-width: 0;
      min-height: 470px;
      overflow: hidden;
      border: 1px solid var(--line-dark);
      border-radius: 4px;
      background: #f5f0e6;
    }
    .map-svg { display: block; width: 100%; height: 100%; min-height: 470px; }
    .map-note {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 10px;
      color: var(--muted);
      font: 10px var(--mono);
      border-top: 1px solid var(--line);
    }
    .panel {
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--sheet);
    }
    .panel-kicker { margin: 0 0 10px; color: var(--muted); font: 10px var(--mono); letter-spacing: .13em; text-transform: uppercase; }
    .scope-rail, .outline-rail, .inspector, .ledger-rail { padding: 15px; }
    .scope-rail, .outline-rail, .inspector { overflow: auto; }
    .section-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 17px 0 7px;
      color: var(--muted);
      font: 10px var(--sans);
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .section-line:first-of-type { margin-top: 0; }
    .section-line button { padding: 2px 7px; font-size: 14px; line-height: 1.1; }
    .nav-list { display: grid; gap: 4px; }
    .nav-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 9px;
      text-align: left;
      border-color: transparent;
      background: transparent;
      padding: 7px 8px;
    }
    .nav-row.active { border-color: var(--line); background: var(--sheet-strong); }
    .nav-row small { display: block; color: var(--muted); font: 10px var(--mono); }
    .node-seal {
      width: 25px;
      height: 25px;
      flex: none;
      display: grid;
      place-items: center;
      border: 1px solid var(--line-dark);
      border-radius: 50%;
      color: var(--moss);
      font: 9px var(--mono);
    }
    .route-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .route-row .nav-row { flex: 1; }
    .route-swatch { width: 21px; border-top: 2px solid var(--moss); }
    .route-swatch.unresolved { border-top-style: dashed; border-color: var(--accent); }
    .empty-copy { color: var(--muted); font-size: 12px; }
    .spatial-layout { display: grid; grid-template-columns: 218px minmax(420px, 1fr) 288px; gap: 11px; min-height: 690px; }
    .scope-rail { align-self: stretch; }
    .map-workspace { min-width: 0; display: flex; flex-direction: column; gap: 10px; padding: 13px; }
    .map-workspace .map-frame { flex: 1; min-height: 530px; }
    .map-workspace .map-svg { min-height: 530px; }
    .inspector { min-height: 690px; }
    .inspector h2 { margin: 2px 0 4px; font-size: 22px; }
    .inspector-intro { color: var(--muted); font-size: 12px; }
    .type-chip {
      display: inline-block;
      margin: 4px 0 9px;
      padding: 4px 6px;
      border: 1px solid var(--line);
      border-radius: 3px;
      color: var(--moss);
      font: 9px var(--mono);
      text-transform: uppercase;
    }
    .field-stack { display: grid; gap: 11px; margin-top: 15px; }
    .record-facts { display: grid; gap: 7px; margin: 15px 0; padding: 11px 0; border-block: 1px solid var(--line); }
    .record-fact { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; }
    .record-fact span:first-child { color: var(--muted); }
    .hint-box { margin-top: 13px; padding: 10px; border-left: 2px solid var(--gold); color: var(--muted); background: #eee7d8; font-size: 11px; }
    .status-line { min-height: 23px; color: var(--moss); font: 11px var(--mono); }
    .outline-layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); grid-template-rows: minmax(560px, 1fr) auto; gap: 11px; }
    .outline-rail { grid-column: 1; grid-row: 1; max-height: 710px; }
    .board-panel { grid-column: 2; grid-row: 1; min-width: 0; padding: 13px; display: flex; flex-direction: column; gap: 10px; }
    .board-panel .map-frame { flex: 1; min-height: 520px; }
    .board-panel .map-svg { min-height: 520px; }
    .property-dock { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(220px, .75fr) minmax(0, 2fr); gap: 20px; padding: 15px 18px; }
    .property-dock .field-stack { grid-template-columns: repeat(3, minmax(120px, 1fr)); margin-top: 0; }
    .property-dock .wide-field { grid-column: span 2; }
    .tree-level { margin-top: 4px; }
    .tree-row { display: block; }
    .tree-button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px 7px;
      border-color: transparent;
      background: transparent;
      text-align: left;
      font-size: 12px;
    }
    .tree-button.active { border-color: var(--line); background: var(--sheet-strong); }
    .tree-button.orbit { color: var(--moss); font: 10px var(--mono); }
    .tree-mark { width: 18px; color: var(--accent); font: 9px var(--mono); text-align: center; }
    .tree-indent { margin-left: 12px; padding-left: 7px; border-left: 1px solid var(--line); }
    .ledger-layout { display: grid; grid-template-columns: minmax(0, 1fr) 205px; gap: 11px; }
    .register-main { min-width: 0; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(360px, .95fr); grid-template-rows: minmax(510px, auto) auto; gap: 11px; }
    .register-panel, .register-map, .record-panel { padding: 14px; }
    .register-panel { min-width: 0; overflow: auto; }
    .register-map { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
    .register-map .map-frame { flex: 1; min-height: 450px; }
    .register-map .map-svg { min-height: 450px; }
    .register-panel h2 { margin: 0 0 3px; font-size: 22px; }
    .register-panel > p { margin: 0 0 12px; color: var(--muted); font-size: 12px; }
    .register-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .register-table th { padding: 7px 6px; color: var(--muted); border-bottom: 1px solid var(--line-dark); text-align: left; font: 9px var(--sans); letter-spacing: .1em; text-transform: uppercase; }
    .register-table td { padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
    .register-table tr.selected td { background: #eee6d7; }
    .register-table .row-pick { padding: 0; border: 0; color: var(--ink); background: none; text-align: left; }
    .register-table .row-pick:hover { color: var(--accent); }
    .register-table .key-cell { color: var(--accent); font: 10px var(--mono); white-space: nowrap; }
    .record-panel { grid-column: 1 / -1; }
    .record-panel .field-stack { grid-template-columns: repeat(4, minmax(110px, 1fr)); }
    .record-panel .wide-field { grid-column: span 2; }
    .ledger-rail { display: flex; flex-direction: column; gap: 16px; }
    .legend-row { display: flex; align-items: center; gap: 8px; margin: 7px 0; color: var(--muted); font-size: 11px; }
    .legend-mark { width: 11px; height: 11px; flex: none; border: 1px solid var(--moss); border-radius: 50%; }
    .legend-mark.route { height: 0; border: 0; border-top: 2px solid var(--moss); border-radius: 0; }
    .legend-mark.hazard { border-color: var(--accent); border-radius: 0; transform: rotate(45deg); }
    .state-monitor {
      margin-top: 12px;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: rgba(245,240,230,.75);
    }
    .state-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
    .state-head strong { font-size: 12px; font-weight: 500; }
    .state-head span { color: var(--muted); font: 10px var(--mono); }
    .state-monitor summary { margin-top: 6px; color: var(--moss); cursor: pointer; font: 10px var(--mono); }
    .state-monitor pre {
      max-height: 310px;
      overflow: auto;
      margin: 10px 0 0;
      padding: 11px;
      color: #dce1d8;
      background: #29332e;
      font: 10px/1.45 var(--mono);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .switcher {
      position: fixed;
      z-index: 10;
      left: 50%;
      bottom: 18px;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 7px 10px;
      border: 1px solid #536058;
      border-radius: 999px;
      color: #f5f0e6;
      background: #26322c;
      box-shadow: 0 8px 24px rgba(27,33,29,.23);
      transform: translateX(-50%);
      font: 11px var(--sans);
    }
    .switcher button {
      width: 29px;
      height: 29px;
      padding: 0;
      border-color: #647168;
      border-radius: 50%;
      color: #fffaf0;
      background: #34433a;
      font: 17px/1 var(--sans);
    }
    .switcher button:hover { color: #fff; background: var(--accent); }
    .switcher-label { min-width: 155px; text-align: center; }
    .switcher-label strong { color: #e4c88f; font-weight: 600; }
    .toast {
      position: fixed;
      z-index: 9;
      right: 22px;
      bottom: 22px;
      max-width: min(400px, calc(100vw - 44px));
      padding: 9px 13px;
      border: 1px solid #637066;
      border-radius: 4px;
      color: #f5f0e6;
      background: #26322c;
      font: 11px var(--mono);
      opacity: 0;
      pointer-events: none;
    }
    .toast.visible { opacity: 1; }

    @media (max-width: 1150px) {
      .spatial-layout { grid-template-columns: 190px minmax(380px, 1fr); }
      .spatial-layout .inspector { grid-column: 1 / -1; min-height: 0; }
      .outline-layout { grid-template-columns: 220px minmax(0, 1fr); }
      .top-scope { display: none; }
      .register-main { grid-template-columns: minmax(0, 1fr) minmax(300px, .85fr); }
    }
    @media (max-width: 780px) {
      body { padding-inline: 10px; }
      .topbar { align-items: flex-start; padding: 12px 0; }
      .top-actions { flex-wrap: wrap; justify-content: flex-end; }
      .top-actions button { padding: 6px 7px; font-size: 10px; }
      .brand { min-width: 160px; }
      .intro { align-items: flex-start; flex-direction: column; gap: 5px; }
      .actionbar .view-tabs { margin-left: 0; }
      .spatial-layout, .outline-layout, .ledger-layout { display: flex; flex-direction: column; }
      .scope-rail, .outline-rail, .inspector, .ledger-rail { min-height: 0; max-height: none; }
      .map-workspace, .board-panel { min-height: 620px; }
      .property-dock { grid-template-columns: 1fr; }
      .property-dock .field-stack, .record-panel .field-stack { grid-template-columns: 1fr 1fr; }
      .register-main { display: flex; flex-direction: column; }
      .register-map { min-height: 500px; }
      .record-panel .wide-field, .property-dock .wide-field { grid-column: auto; }
      .switcher { bottom: 10px; }
      .toast { right: 10px; bottom: 68px; }
    }

    /* Exported SVG copies these rules so the file stands alone outside the page. */
    .map-bg { fill: #f5f0e6; }
    .map-grid { fill: url(#map-grid); }
    .map-title { fill: #28322d; font: 500 19px Georgia, serif; }
    .map-caption, .map-coord, .node-meta, .object-key, .orbit-caption { fill: #69736a; font: 10px Consolas, monospace; }
    .map-cross { stroke: #cfc6b5; stroke-width: 1; }
    .route-line { fill: none; stroke: #536a5d; stroke-width: 2.4; }
    .route-edge.unresolved .route-line { stroke: #9e4c36; stroke-dasharray: 8 7; }
    .route-edge.is-selected .route-line { stroke: #9e4c36; stroke-width: 4; }
    .route-label-bg { fill: #fffaf0; stroke: #aaa18f; }
    .route-label { fill: #303a33; font: 10px Consolas, monospace; text-anchor: middle; }
    .external-label { fill: #9e4c36; font: 9px Consolas, monospace; text-anchor: middle; }
    .system-node { cursor: grab; touch-action: none; }
    .system-node:active { cursor: grabbing; }
    .system-node rect { fill: #eee7d9; stroke: #69766c; stroke-width: 1.5; }
    .system-node:hover rect, .system-node:focus rect, .system-node.is-open rect { stroke: #9e4c36; stroke-width: 2.5; }
    .system-node .node-name { fill: #28322d; font: 500 16px Georgia, serif; text-anchor: middle; }
    .system-node .node-meta { text-anchor: middle; }
    .node-core { fill: #536a5d; }
    .orbit-ring { fill: none; stroke: #9b907d; stroke-width: 1.2; stroke-dasharray: 3 6; }
    .orbit-ring.is-selected { stroke: #9e4c36; stroke-width: 2.5; }
    .orbit-ring.drop-target { stroke: #9e4c36; stroke-width: 3; stroke-dasharray: 2 4; }
    .orbit-hit { fill: none; stroke: transparent; stroke-width: 13; cursor: pointer; }
    .orbit-caption { text-anchor: middle; }
    .object-mark { cursor: grab; touch-action: none; }
    .object-mark:active { cursor: grabbing; }
    .object-mark:hover .object-core, .object-mark:focus .object-core, .object-mark.selected .object-core { stroke: #9e4c36; stroke-width: 3; }
    .object-core { fill: #e1bf7b; stroke: #485e52; stroke-width: 1.6; }
    .object-core.star { fill: #cfac68; stroke: #856934; }
    .object-core.moon { fill: #d7d3c8; }
    .object-core.station { fill: #6d8073; }
    .object-core.hazard { fill: #b75c43; }
    .object-core.jump { fill: #fffaf0; stroke: #9e4c36; stroke-width: 2; }
    .object-label { fill: #28322d; font: 11px Georgia, serif; }
    .object-key { font-size: 9px; }
    .system-hazard-line { stroke: #9e4c36; stroke-width: 1.2; stroke-dasharray: 3 4; }
    .empty-map { fill: #69736a; font: 14px Georgia, serif; text-anchor: middle; }
    .empty-map-sub { fill: #8a8c82; font: 10px Consolas, monospace; text-anchor: middle; }
  </style>
</head>
<body>
  <div id="app"></div>
  <nav class="switcher" id="variant-switcher" aria-label="Prototype layout variants">
    <button type="button" data-variant-step="-1" aria-label="Previous layout">&#8592;</button>
    <span class="switcher-label" id="variant-label" aria-live="polite"></span>
    <button type="button" data-variant-step="1" aria-label="Next layout">&#8594;</button>
  </nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    "use strict";

    const VARIANTS = {
      A: "Chart table",
      B: "Orbit tree",
      C: "Survey ledger",
      D: "Canvas + hierarchy"
    };
    const objectTypes = {
      star: ["CelestialBody", "star", "STAR", "Star"],
      planet: ["CelestialBody", "planet", "PL", "Planet"],
      moon: ["CelestialBody", "moon", "MO", "Moon"],
      asteroid: ["SmallBody/Field", "asteroid", "AST", "Asteroid"],
      belt: ["SmallBody/Field", "belt", "BELT", "Belt"],
      station: ["Installation", "station", "ST", "Station"],
      base: ["Installation", "base", "BASE", "Base"],
      colony: ["Installation", "colony", "COL", "Colony"],
      vessel: ["Vessel", "vessel", "VES", "Vessel"],
      derelict: ["Vessel", "derelict", "DER", "Derelict"],
      jumpPoint: ["JumpPoint", "jump-point", "JP", "Jump Point"],
      anomaly: ["Phenomenon", "anomaly", "AN", "Anomaly"],
      nebula: ["Phenomenon", "nebula", "NEB", "Nebula"],
      hazard: ["Phenomenon", "hazard", "HZ", "Hazard"],
      other: ["Other", "other", "OTH", "Other"]
    };

    const system = (id, name, objects, orbits) => ({ id, name, objects, orbits });
    const mapObject = (id, family, subtype, key, name, description, location, extra = {}) => ({
      id, family, subtype, key, name, description, location, fields: {}, customValues: {}, ...extra
    });
    const initialCluster = {
      id: "cluster-kestrel",
      name: "Kestrel Reach",
      systems: [
        system("system-vesper", "Vesper", [
          mapObject("obj-va", "CelestialBody", "star", "A", "Vesper A", "Amber primary. The chart is schematic, not to scale.", { kind: "system", x: .27, y: .55 }),
          mapObject("obj-vb", "CelestialBody", "star", "B", "Vesper B", "Blue-white companion, plotted separately for clarity.", { kind: "system", x: .70, y: .55 }),
          mapObject("obj-iria", "CelestialBody", "planet", "I", "Iria", "Chlorine cloud deck; surface reports conflict.", { kind: "orbit", orbitId: "orbit-va-1" }, { fields: { atmosphere: "Toxic" }, customValues: { intel: "Old beacon under the cloudline." } }),
          mapObject("obj-nix", "CelestialBody", "moon", "I-a", "Nix", "Small moon with a buried relay.", { kind: "orbit", orbitId: "orbit-iria-1" }, { fields: { atmosphere: "Thin" } }),
          mapObject("obj-dross", "CelestialBody", "planet", "II", "Dross", "Cold outer body.", { kind: "orbit", orbitId: "orbit-va-2" }, { fields: { atmosphere: "None" } }),

          mapObject("obj-h-colony", "Installation", "colony", "C-1", "Bellwether Colony", "A failing surface settlement.", { kind: "orbit", orbitId: "orbit-h-1" }),
          mapObject("jp-h-1", "JumpPoint", "jump-point", "JP-01", "Harrow inbound", "Logical route endpoint.", { kind: "system", x: .09, y: .72 }),

        ], [

        ]),
        system("system-mourn", "Mourn", [
          mapObject("obj-m-star", "CelestialBody", "star", "A", "Mourn A", "Low-luminosity primary.", { kind: "system", x: .52, y: .5 }),
          mapObject("obj-m-derelict", "Vessel", "derelict", "D-1", "The Quiet", "Unpowered vessel in a wide orbit.", { kind: "orbit", orbitId: "orbit-m-1" }),
          mapObject("jp-m-1", "JumpPoint", "jump-point", "JP-01", "Mourn approach", "Logical route endpoint.", { kind: "system", x: .11, y: .25 })
        ], [

      ],
      routes: [
