<text x="48" y="930" font-size="11" fill="#586461" font-weight="400" text-anchor="start">Mobile controls were blocked by observed UI geometry: baseline hierarchy intercepted the map control; B Aster stayed out of view after Fit. Gesture and Fields comparisons n=0.</text>
<text x="48" y="952" font-size="11" fill="#586461" font-weight="400" text-anchor="start">CDP encodedDataLength is received bytes, not exact wire bytes. Native startup scenes differ. First Vela visit history differs; warm cycle follows a shared map history.</text>
<text x="48" y="974" font-size="11" fill="#586461" font-weight="400" text-anchor="start">B = accepted commit + three lab-only orbit-order normalizations; accepted B source includes A/C scaffolding. No performance budget applied.</text>
