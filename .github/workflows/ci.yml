name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        playwright_version: ['1.64.0']
    container:
      image: mcr.microsoft.com/playwright:v${{ matrix.playwright_version }}-noble
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_IMAGE_VERSION: ${{ matrix.playwright_version }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - name: Verify Playwright package matches browser image
        run: |
          installed_version="$(node -p 'require("@playwright/test/package.json").version')"
          if [[ "$installed_version" != "$PLAYWRIGHT_IMAGE_VERSION" ]]; then
            echo "Playwright package $installed_version does not match browser image $PLAYWRIGHT_IMAGE_VERSION" >&2
            exit 1
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test -- --reporter=github,html

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-reports
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
